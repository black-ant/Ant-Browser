database:
    type: sqlite
    sqlite:
        path: data/app.db
app:
    name: ZwBrowser
    window:
        width: 1750
        height: 1000
        min_width: 1200
        min_height: 700
runtime:
    max_memory_mb: 0
    gc_percent: 100
logging:
    # 多开挂机场景:只保留 warn 及以上,避免每实例持续产生日志开销。
    level: warn
    file_enabled: false
    file_path: data/logs/app.log
    format: text
    buffer_size: 4
    async_queue_size: 1000
    flush_interval_ms: 1000
    rotation:
        enabled: false
        max_size_mb: 100
        max_age: 7
        max_backups: 5
        time_interval: daily
    interceptor:
        # 关闭 API 拦截器:开启时每次 Wails 调用都会全量序列化参数与返回值,纯浪费。
        enabled: false
        log_parameters: false
        log_results: false
        sensitive_fields:
            - password
            - token
            - secret
browser:
    user_data_root: data
    local_country: CN
    default_fingerprint_args:
        - --fingerprint-brand=Chrome
        - --fingerprint-platform=windows
        - --disable-non-proxied-udp
        - --fingerprinting-canvas-image-data-noise
        - --fingerprinting-client-rects-noise
    default_launch_args:
        - --disable-sync
        - --no-first-run
    default_start_urls: []
    light_start_enabled: true
    restore_last_session: false
    # 直播多开性能模式:A 级(零指纹面)默认开;B 级激进合并站点隔离,仅专用挂机墙开启。
    live_perf_enabled: true
    live_perf_aggressive: false
    # 后台自动测速:挂机场景默认关(会周期拉起代理内核+发探测流量);手动测速不受影响。
    speed_autotest_enabled: false
    # 定时主动内存回收:moderate 温和,critical 更狠但可能让播放器短暂卡顿。
    memory_reclaim_enabled: true
    memory_reclaim_interval_ms: 600000
    memory_reclaim_level: moderate
    live_keepalive_interval_min_ms: 60000
    live_keepalive_interval_max_ms: 90000
    start_ready_timeout_ms: 3000
    start_stable_window_ms: 1200
    cores:
        - core_id: core-fingerprint-chromium-148
          core_name: Chrome fingerprint-chromium-148
          core_path: chrome/fingerprint-chromium-148
          is_default: true
    default_connector_type: xray
    kernel_distribution:
        "144": 30
        "148": 70
proxy_check:
    bridge_start_timeout_ms: 15000
    speed_target_id: ""
    ip_health_target_id: ""
    targets: []
launch_server:
    port: 19876
    auth:
        enabled: false
        api_key: ""
        header: X-Ant-Api-Key
automation:
    enabled: true
    install_policy: on_demand
    runtime_version: node-22.15.1-playwright-core-1.59.0
    keep_runtime_on_disable: true
    artifacts_dir: data/automation/artifacts
    node_source: auto
    node_version: 22.15.1
    playwright_core_version: 1.59.0
