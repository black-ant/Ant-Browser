name: Build Arch Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Arch x86_64 package
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel

    defaults:
      run:
        shell: bash

    steps:
      - name: Install checkout tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed \
            git \
            at-spi2-core \
            cairo \
            gdk-pixbuf2 \
            go \
            glibc \
            glib2 \
            gtk3 \
            harfbuzz \
            hicolor-icon-theme \
            libnotify \
            libsoup3 \
            libx11 \
            libxcb \
            libxcomposite \
            libxcursor \
            libxdamage \
            libxext \
            libxfixes \
            libxi \
            libxrandr \
            libxrender \
            mesa \
            namcap \
            nspr \
            nss \
            nodejs \
            pango \
            pkgconf \
            python \
            webkit2gtk-4.1 \
            xdg-utils \
            zlib

      - name: Apply package version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/release.py version "$PACKAGE_VERSION"

      - name: Download shared frontend
        uses: actions/download-artifact@v4
        with:
          name: ant-browser-frontend
          path: frontend/dist

      - name: Create build user
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install Wails CLI
        run: |
          set -euo pipefail
          runuser -u builder -- bash -lc "go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0"
          runuser -u builder -- bash -lc "~/go/bin/wails version"

      - name: Verify bundled runtimes
        run: |
          set -euo pipefail
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE' && bash tools/runtime/verify-runtime.sh linux-amd64"

      - name: Build Wails binary
        run: |
          set -euo pipefail
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE' && PATH=\"\$HOME/go/bin:\$PATH\" wails build -s -m -skipbindings -skipembedcreate -platform linux/amd64 -o ant-chrome -tags webkit2_41 -trimpath"
          test -x build/bin/ant-chrome
          ldd build/bin/ant-chrome | tee /tmp/ant-browser-ldd.txt
          if grep -q "not found" /tmp/ant-browser-ldd.txt; then
            exit 1
          fi
          grep -q "libwebkit2gtk-4.1" /tmp/ant-browser-ldd.txt

      - name: Build Arch package
        run: |
          set -euo pipefail
          install -d -o builder -g builder publish/output
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/packaging/arch' && PKGDEST='$GITHUB_WORKSPACE/publish/output' makepkg -f -C --clean --noconfirm"

      - name: Validate Arch package
        env:
          ANT_BROWSER_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pkg_version="${ANT_BROWSER_VERSION//-/_}"
          pkg_file="publish/output/ant-browser-${pkg_version}-1-x86_64.pkg.tar.zst"
          echo "Validating: $pkg_file"
          pacman -Qpi "$pkg_file"
          pacman -Qlp "$pkg_file" >/dev/null
          namcap packaging/arch/PKGBUILD "$pkg_file"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: ant-browser-package-arch-x86_64
          path: publish/output/ant-browser-*-x86_64.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
