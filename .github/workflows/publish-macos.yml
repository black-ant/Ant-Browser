name: Build macOS Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }} (unsigned)
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Apply package version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/release.py version "$PACKAGE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: ant-browser-frontend
          path: frontend/dist
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build unsigned macOS package using shared frontend
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash publish/mac/publish-mac.sh --arch "$PACKAGE_ARCH" --version "$PACKAGE_VERSION" --skip-frontend
      - name: Validate app bundle and ZIP permissions
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app_name="AntBrowser-${PACKAGE_VERSION}-macos-${PACKAGE_ARCH}.app"
          app_path="publish/output/$app_name"
          test -x "$app_path/Contents/MacOS/ant-chrome"
          test -x "$app_path/Contents/MacOS/bin/xray"
          test -x "$app_path/Contents/MacOS/bin/sing-box"
          plutil -lint "$app_path/Contents/Info.plist"
          validate_dir="$(mktemp -d)"
          ditto -x -k "publish/output/AntBrowser-${PACKAGE_VERSION}-macos-${PACKAGE_ARCH}.zip" "$validate_dir"
          test -x "$validate_dir/$app_name/Contents/MacOS/ant-chrome"
          test -x "$validate_dir/$app_name/Contents/MacOS/bin/xray"
          test -x "$validate_dir/$app_name/Contents/MacOS/bin/sing-box"
      - uses: actions/upload-artifact@v4
        with:
          name: ant-browser-package-macos-${{ matrix.arch }}
          # ZIP preserves executable permissions; uploading a raw .app does not.
          path: publish/output/AntBrowser-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
