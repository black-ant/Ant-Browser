name: Build Linux Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Apply package version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: python3 scripts/ci/release.py version "$PACKAGE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: ant-browser-frontend
          path: frontend/dist
      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl dpkg-dev git \
            libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            patchelf pkg-config python3 tar
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compile all Go packages and test binaries
        if: matrix.arch == 'amd64'
        run: go test -tags webkit2_41 -run '^$' ./...
      - name: Build Linux packages using shared frontend
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash publish/linux/publish-linux.sh --arch "$PACKAGE_ARCH" --version "$PACKAGE_VERSION" --skip-frontend
      - name: Validate packages and shared libraries
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ldd build/bin/ant-chrome | tee /tmp/ant-browser-ldd.txt
          ! grep -q 'not found' /tmp/ant-browser-ldd.txt
          grep -q 'libwebkit2gtk-4.1' /tmp/ant-browser-ldd.txt
          deb_file="publish/output/ant-browser_${PACKAGE_VERSION}_${PACKAGE_ARCH}.deb"
          dpkg-deb -I "$deb_file"
          dpkg-deb --contents "$deb_file" > /tmp/ant-browser-deb-files.txt
          validate_dir="$(mktemp -d)"
          tar -xzf "publish/output/AntBrowser-${PACKAGE_VERSION}-linux-${PACKAGE_ARCH}.tar.gz" -C "$validate_dir"
          test -x "$validate_dir/ant-chrome"
          test -x "$validate_dir/bin/xray"
          test -x "$validate_dir/bin/sing-box"
          test -f "$validate_dir/config.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: ant-browser-package-linux-${{ matrix.arch }}
          path: |
            publish/output/*_${{ matrix.arch }}.deb
            publish/output/*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
